; menu.default.ini: the PiTrex menu as it comes with the package. DO NOT EDIT THIS FILE: an update
; replaces it, and your changes would be lost.
;
; To change the menu, create menu.ini in this folder (menu/) and write only your changes there. The PiTrex
; reads this file first and menu.ini last, so menu.ini wins. In menu.ini you can:
;
;   change an entry      repeat its [NAME] with only the lines to change
;                          [MAJOR HAVOC]
;                          text = WORKS GREAT NOW.
;   move it              [TEMPEST]
;                          category = FAVORITES
;   list it in more      [MAJOR HAVOC]
;   places too             also = FAVORITES, TWO PLAYERS
;   hide it, show it     [MAZE]                  [HELLO WORLD]
;                          hide = 1                hide = 0
;   add your own         [MY GAME]
;                          category = PITREX
;                          image = mygame.img
;
; A line starting with ; is a comment. Each [SECTION] is one entry; its name is the title shown in the menu.
; The line that says what it is:
;   image  = ...   a program to start (with param1, param2 if it takes them)
;   file   = ...   title, notes or a category for a file the menu finds by itself
;   folder = ...   with image: every file in that folder becomes an entry ({dir} and {file} are filled in)
;   none           changes the section of that name, or is a category: [ARCADE / ATARI] with hide, order, text
; Other lines: category = ARCADE / ATARI (a new path makes a new folder), also = more categories, needs = a file
; that must be on the card, text = a note line (up to 12), control = a line of the CONTROLS page (Button 2),
; hide = 1 or 0, emulator = speedy or exact (Vectrex games), order = listed. Text: A-Z, 0-9, . and ! only, about
; 46 characters per line. Full description: NEW_MENU_README.md

