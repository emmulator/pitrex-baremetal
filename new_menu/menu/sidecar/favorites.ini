; favorites.ini: an example of a collection, and a place to keep your own favorite games.
;
; This file makes a FAVORITES category in the main menu. Each game listed here also stays where it always was;
; FAVORITES just shows it a second time, so a game can be in as many collections as you like.
;
; The installer puts this file on the card only if there is no favorites.ini yet, so your own list is never
; overwritten by an update. Edit it freely: add games, remove them, change the order. A line starting with ;
; is a comment and is ignored.
;
; ---------------------------------------------------------------------------------------------------------------
; 1. The collection itself
;
; A section whose name is a category sets how that category behaves.
;   order = listed   shows the games in the order this file lists them (without it they are sorted A to Z)
;   text  = ...      is the help shown under the category when it is highlighted (up to 6 lines; only A-Z, 0-9,
;                    . and ! can be drawn, about 46 characters per line)

[FAVORITES]
order = listed
text  = THE GAMES I PLAY MOST.
text  = EDIT MENU FAVORITES.INI TO CHANGE THEM.

; ---------------------------------------------------------------------------------------------------------------
; 2. Games that are already in the menu
;
; Use the name in brackets exactly as it appears in menu.default.ini (usually the title you see in the menu) and
; add "also = FAVORITES". Nothing else about the game changes.

[VECTORBLADE]
also = FAVORITES

[ASTEROIDS]
also = FAVORITES

; ---------------------------------------------------------------------------------------------------------------
; 3. A Vectrex game file the menu finds by itself (under VECTREX > ALL ROMS)
;
; Name the file with "file =", its path on the card. This is the original 1982 Armor Attack cartridge, not the
; arcade game of the same name. The name in brackets becomes its title everywhere, so it also shows as
; ARMOR ATTACK (instead of ARMOR) in ALL ROMS. Button 4 starts it with Exact, Button 2 with Speedy.

[ARMOR ATTACK]
file = vectrex/original/ARMOR.BIN
also = FAVORITES

; ---------------------------------------------------------------------------------------------------------------
; More collections
;
; "also" can name several collections, separated by commas, and a collection that does not exist yet is created:
;
;   [MAJOR HAVOC]
;   also = FAVORITES, TWO PLAYERS
;
; To put a collection inside another category, write its path: also = VECTREX / FAVORITES.
; Want a different name than FAVORITES? Change it in all the places above, or make a new file (collections.ini,
; kids.ini...) in the menu folder: every .ini file there is read.
