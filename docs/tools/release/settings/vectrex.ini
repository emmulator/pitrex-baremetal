[VECTREX_EXACT]
; file in directory vetrex
; which is 8kb/Volumes/BAREMETAL/vectrex.ini
; and a valid vectrex BIOS
;ROM_FILE = bios/7ADB.bin
ROM_FILE = bios/7ADB.bin
; 
;CYCLE_EQUIVALENT = 648 ; 
HANDLE_STATES = 0; (1 == default) on start load, on 4 button "end" save state of the current vertex

; if one, then even in exact vectrex, the strings are displayed using the Pitrex not the vectrex
; all "BIOS" strings anyway
INTERNAL_STRING_DISPLAY = 1

; if set to one, it FORCES 48k Rom emulation
; this should not be necessary for ROMS that are between 32k and 64k
IS_48_KROM = 0

; Rom that the vectrex emulator should load upon start
; this file name ist based on the root directory of the SD cart, no "vectrex" directory is attached!
;CART_BOOT_FILE = vectrex/AKLABETH.BIN

; allow 
TERMINAL_ACCESS = 1
